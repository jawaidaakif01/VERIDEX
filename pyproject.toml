[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veridex"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.6",
    "langchain-google-genai>=4.4.2",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.16",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pydantic>=2.14.1",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
    "typer>=0.27.3",
]

[tool.setuptools]
packages = ["veridex"]
